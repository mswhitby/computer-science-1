name: Validate and request CS1 integration curriculum publish
on:
  push:
    branches: [main]
    paths:
      - 'docs/units/**'
      - 'docs/challenges/**'
      - 'docs/learning-map.js'
      - 'docs/python-worker.js'
      - 'units/**'
      - '.github/workflows/publish-curriculum-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published curriculum IDs and titles
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const path=require('node:path');
          const ctx=vm.createContext({window:{}});
          for(const file of fs.readdirSync('docs/units').filter(x=>/^data-\d\d\.js$/.test(x)).sort())vm.runInContext(fs.readFileSync(path.join('docs/units',file),'utf8'),ctx,{timeout:1000});
          for(let n=1;n<=4;n++)vm.runInContext(fs.readFileSync('docs/challenges/data-'+n+'.js','utf8'),ctx,{timeout:1000});
          const lessons=ctx.window.CS1_UNITS||[],challenges=ctx.window.CS1_CHALLENGES||[];
          if(lessons.length<24||challenges.length<24)throw Error('Incomplete curriculum');
          const ids=new Set();
          for(const row of [...lessons,...challenges]){
            if(typeof row.id!=='string'||!row.id.trim()||typeof row.title!=='string'||!row.title.trim()||ids.has(row.id))throw Error('Invalid/duplicate id or title: '+row.id);
            ids.add(row.id);
            if(row.markdown&&!fs.existsSync(path.join('units',row.markdown)))throw Error('Missing lesson: '+row.markdown);
          }
          console.log('Validated '+lessons.length+' lessons and '+challenges.length+' challenges');
          JS
      - name: Request isolated Classroom curriculum publish
        env:
          DISPATCH_TOKEN: ${{ secrets.CLASSROOM_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Set CLASSROOM_DISPATCH_TOKEN in this repository's Actions secrets; it must have permission to dispatch workflows in mswhitby/classroom."
            exit 1
          fi
          curl --fail-with-body --show-error --silent --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mswhitby/classroom/dispatches \
            -d "{\"event_type\":\"cs1-curriculum-updated\",\"client_payload\":{\"source_repository\":\"mswhitby/computer-science-1\",\"source_sha\":\"$SOURCE_SHA\"}}"
