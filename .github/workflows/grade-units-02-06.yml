name: Grade Units 02-06
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out submitted PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: student
          fetch-depth: 2
          persist-credentials: false
      - name: Check out trusted grader
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grade changed lesson scripts
        run: python trusted/grader/grade_units_02_06.py student
